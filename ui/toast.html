<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pink Cloud Notifications</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Pink pop-ups for new notifications, stacked in the bottom-right corner. The window
     covers the screen but only catches the mouse over a pop-up. */
  body { font-size: 13px; }
  .stack { position: absolute; right: 14px; bottom: 12px; width: 370px; display: flex; flex-direction: column-reverse; gap: 10px; }
  .toast { position: relative; display: flex; gap: 12px; padding: 14px 14px 14px 14px; border-radius: 18px; cursor: pointer; overflow: hidden;
    background: color-mix(in srgb, var(--g1-soft) 35%, rgba(255, 255, 255, .96)); border: 1px solid var(--border);
    box-shadow: 0 14px 40px color-mix(in srgb, var(--shade) 35%, transparent), inset 0 1px 0 rgba(255, 255, 255, .8);
    animation: toastIn .6s var(--spring) both; transition: transform .35s var(--spring), opacity .25s; }
  :root[data-theme="dark"] .toast { background: color-mix(in srgb, var(--g1-soft) 35%, rgba(16, 12, 28, .96)); box-shadow: 0 14px 40px rgba(0, 0, 0, .45); }
  .toast:hover { transform: translateX(-4px) scale(1.01); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(120%) rotate(6deg) scale(.9); filter: blur(8px); } }
  .toast.out { animation: toastOut .4s var(--ease) forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateX(110%) scale(.92); filter: blur(6px); } }
  /* a light sweep when it lands, and a bar that shows how long until it goes away */
  .toast::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 35%; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--sheen), transparent); animation: shine 1s .25s var(--smooth) both; }
  .timer { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; transform-origin: left;
    background: linear-gradient(90deg, var(--g1), var(--g2)); animation: drain var(--life) linear forwards; }
  .toast:hover .timer { animation-play-state: paused; }
  @keyframes drain { to { transform: scaleX(0); } }
  .icon { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; object-fit: contain; animation: hop .6s .2s var(--spring) both; }
  @keyframes hop { from { transform: scale(.3) rotate(-30deg); } }
  .txt { flex: 1; min-width: 0; }
  .app { font-size: 11px; color: var(--text-2); margin-bottom: 2px; }
  .title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { color: var(--text-2); margin-top: 2px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
  .pic { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 12px;
    opacity: 0; transition: opacity .15s, background .15s; background: var(--hi); }
  .toast:hover .x { opacity: 1; }
  .x:hover { background: var(--g3); color: #fff; }
  /* the update pop-up stays until you choose, and has buttons */
  .toast.update { cursor: default; border: 1px solid color-mix(in srgb, var(--g2) 60%, transparent); }
  .toast.update .icon { border-radius: 12px; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .acts button { height: 32px; padding: 0 14px; border-radius: 16px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--hi); color: var(--text);
    transition: transform .2s var(--spring), filter .15s; }
  .acts button:hover { transform: scale(1.05); }
  .acts .go { background: linear-gradient(120deg, var(--g1), var(--g2)); border: 0; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .acts .go:disabled { filter: saturate(.5); cursor: progress; }
  /* Pink Cloud's own cards */
  .badgeic { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 4px 14px color-mix(in srgb, var(--g2) 45%, transparent); animation: hop .6s .2s var(--spring) both; }
  .card ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); line-height: 1.4; }
  .card li { margin: 2px 0; }
  /* an achievement lands with a golden glow */
  .card.achievement { border-color: color-mix(in srgb, #f5c542 70%, transparent); }
  .card.achievement .badgeic { background: radial-gradient(circle at 35% 30%, #fff3b0, #f5c542 45%, #e08a1e); animation: hop .6s .2s var(--spring) both, medal 2.4s 1s ease-in-out infinite; }
  @keyframes medal { 50% { box-shadow: 0 0 22px 4px rgba(245, 197, 66, .6); } }
  .card.crash .badgeic { background: linear-gradient(135deg, #f59e8b, #e0566f); }
</style>
</head>
<body>
<div class="stack" id="stack"></div>

<script src="shared.js"></script>
<script src="changes.js"></script>
<script>
  const LIFE = 7000, MAX = 3;
  const names = new Map();
  const nameOf = app => { if (!names.has(app)) names.set(app, invoke("app_name", { app }).catch(() => app)); return names.get(app); };
  const appPath = app => "shell:AppsFolder\\" + app;

  // the window only catches the mouse over the pop-ups
  function reportHits() {
    const dpr = devicePixelRatio;
    const rects = [...stack.children].filter(t => !t.classList.contains("out")).map(t => t.getBoundingClientRect())
      .map(r => [r.left, r.top, r.right, r.bottom].map(v => Math.round(v * dpr)));
    invoke("set_layer_hits", { rects });
  }

  function dismiss(t) {
    if (t.classList.contains("out")) return;
    clearTimeout(t._timer);
    t.classList.add("out");
    setTimeout(() => { t.remove(); reportHits(); }, 400);
    reportHits();
  }

  function show(n) {
    sfx("note");
    const t = document.createElement("div");
    t.className = "toast";
    t.style.setProperty("--life", LIFE + "ms");
    t.innerHTML = `<img class="icon" alt=""><div class="txt"><div class="app"></div><div class="title"></div><div class="body"></div></div><div class="x" title="Dismiss"><i class="ph ph-x"></i></div><div class="timer"></div>`;
    t.querySelector(".title").textContent = n.title;
    t.querySelector(".body").textContent = n.body;
    nameOf(n.app).then(name => t.querySelector(".app").textContent = name + " · now");
    iconFor(appPath(n.app)).then(u => { if (u) t.querySelector(".icon").src = u; else t.querySelector(".icon").style.visibility = "hidden"; });
    if (n.image) {
      const pic = Object.assign(document.createElement("img"), { className: "pic", alt: "", src: window.__TAURI__.core.convertFileSrc(n.image) });
      t.insertBefore(pic, t.querySelector(".x"));
    }
    t.onclick = () => { invoke("launch", { path: appPath(n.app) }); dismiss(t); };
    t.querySelector(".x").onclick = e => { e.stopPropagation(); dismiss(t); };
    // goes away by itself, but not while the mouse is on it
    const arm = () => { t._timer = setTimeout(() => dismiss(t), LIFE); };
    t.onmouseenter = () => clearTimeout(t._timer);
    t.onmouseleave = arm;
    arm();
    stack.appendChild(t);
    while (stack.children.length > MAX) dismiss(stack.children[0]);
    setTimeout(reportHits, 650);
    reportHits();
  }

  // ---------- a newer Pink Cloud is out ----------
  listen("update-available", ({ payload: u }) => {
    if (document.querySelector(".toast.update")) return;
    const t = document.createElement("div");
    t.className = "toast update";
    t.innerHTML = `<img class="icon" alt=""><div class="txt"><div class="app">Pink Cloud</div><div class="title"></div><div class="body"></div>
      <div class="acts"><button class="go">Update now</button><button class="later">Later</button></div></div>`;
    t.querySelector(".title").textContent = `Pink Cloud ${u.version} is here ✨`;
    t.querySelector(".body").textContent = u.notes || "A new version with fixes and new things.";
    invoke("app_exe").then(iconFor).then(src => { if (src) t.querySelector(".icon").src = src; });
    t.querySelector(".later").onclick = e => { e.stopPropagation(); store.set("pc-update-later", u.version); dismiss(t); };
    t.querySelector(".go").onclick = async e => {
      e.stopPropagation();
      const b = t.querySelector(".go");
      b.disabled = true; b.textContent = "Downloading…";
      t.querySelector(".later").remove();
      try {
        await invoke("install_update");   // Pink Cloud closes, installs and comes back
      } catch (err) {
        b.disabled = false; b.textContent = "Try again";
        t.querySelector(".body").textContent = String(err);
      }
    };
    stack.appendChild(t);
    setTimeout(reportHits, 650);
    reportHits();
  });

  // ---------- Pink Cloud's own cards: what's new, achievements, focus, crashes ----------
  // { kind, icon (a Phosphor icon), title, body, list?, buttons?: [[text, action, primary]], life? }
  function card(c) {
    if (c.kind === "achievement") sfx("game"); else sfx("note");
    const t = document.createElement("div");
    t.className = "toast update card " + (c.kind || "");
    const life = c.life ?? (c.buttons ? 0 : 9000);
    t.innerHTML = `<div class="badgeic"><i class="ph-fill"></i></div><div class="txt"><div class="app"></div><div class="title"></div><div class="body"></div></div><div class="x" title="Dismiss"><i class="ph ph-x"></i></div>`;
    t.querySelector(".badgeic i").classList.add(c.icon || "ph-sparkle");
    t.querySelector(".app").textContent = c.kind === "achievement" ? "Achievement unlocked" : "Pink Cloud";
    t.querySelector(".title").textContent = c.title;
    t.querySelector(".body").textContent = c.body || "";
    if (c.list) {
      const ul = document.createElement("ul");
      c.list.slice(0, 6).forEach(x => ul.append(Object.assign(document.createElement("li"), { textContent: x })));
      t.querySelector(".txt").append(ul);
    }
    if (c.buttons) {
      const acts = Object.assign(document.createElement("div"), { className: "acts" });
      c.buttons.forEach(([text, action, primary]) => {
        const b = Object.assign(document.createElement("button"), { textContent: text, className: primary ? "go" : "" });
        b.onclick = e => { e.stopPropagation(); action && action(); dismiss(t); };
        acts.append(b);
      });
      t.querySelector(".txt").append(acts);
    }
    t.querySelector(".x").onclick = e => { e.stopPropagation(); c.onDismiss && c.onDismiss(); dismiss(t); };
    if (life) {
      t.style.setProperty("--life", life + "ms");
      t.append(Object.assign(document.createElement("div"), { className: "timer" }));
      const arm = () => { t._timer = setTimeout(() => dismiss(t), life); };
      t.onmouseenter = () => clearTimeout(t._timer);
      t.onmouseleave = arm;
      arm();
    }
    stack.appendChild(t);
    while (stack.children.length > MAX + 1) dismiss(stack.children[0]);
    setTimeout(reportHits, 650);
    reportHits();
  }
  listen("card", ({ payload }) => card(payload));

  // After an update: what's new. The very first time: the welcome tour.
  (async () => {
    const mine = await invoke("app_version");
    const last = store.get("pc-last-version", null);
    store.set("pc-last-version", mine);
    if (!last) {
      if (await invoke("first_run")) { achieve("hello"); setTimeout(() => invoke("open_tour"), 2500); }
      else showNews(mine, CHANGES.filter(c => c[0] === mine));   // updated from a version without this pop-up
    } else if (newerVersion(mine, last)) {
      showNews(mine, CHANGES.filter(c => newerVersion(c[0], last) && !newerVersion(c[0], mine)));
    }
  })();
  function showNews(version, changes) {
    if (!changes.length) return;
    achieve("updated");
    setTimeout(() => card({
      kind: "news", icon: "ph-sparkle", title: `What's new in Pink Cloud ${version}`, list: changes.flatMap(c => c[1]),
      buttons: [["See everything", () => invoke("open_settings", { page: "news" }), true], ["Nice!"]],
    }), 4000);
  }

  // The last run crashed (see safe start): offer to send the report.
  invoke("crash_report").then(r => {
    if (!r) return;
    setTimeout(() => card({
      kind: "crash", icon: "ph-warning-circle", title: "Pink Cloud closed unexpectedly",
      body: "Sorry about that! Your taskbar was put back for you. Sending the report helps get it fixed.",
      buttons: [["Send report", () => invoke("open_settings", { page: "report" }), true], ["No thanks", () => invoke("dismiss_crash")]],
      onDismiss: () => invoke("dismiss_crash"),
    }), 3000);
  });

  // game mode and focus mode: pop-ups wait until you're done, then the last few come in
  let gaming = false, held = [];
  const quietInGames = () => store.get("pc-game-quiet", true);
  const quietInFocus = () => focusState() && store.get("pc-focus-quiet", true);
  function letThrough() {
    if (gaming || quietInFocus() || !held.length) return;
    held.slice(-3).forEach((n, i) => setTimeout(() => show(n), 600 + i * 250));
    held = [];
  }
  listen("game-mode", ({ payload }) => { gaming = payload.on; letThrough(); });
  addEventListener("pc-focus-change", letThrough);
  invoke("game_state").then(g => gaming = !!g);

  listen("notes-new", ({ payload }) => {
    // pop-ups can be switched off, or held back by Do not disturb (they still go to the panel)
    if (!store.get("pc-note-popups", true) || store.get("pc-dnd", false)) return;
    if ((gaming && quietInGames()) || quietInFocus()) { held.push(...payload); return; }
    payload.forEach((n, i) => setTimeout(() => show(n), i * 250));
  });
  reportHits();
</script>
</body>
</html>
