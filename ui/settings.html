<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { font-size: 13px; }
  .win { height: 100%; display: flex; flex-direction: column; background: var(--panel); border-radius: 10px; overflow: hidden; }

  .title { display: flex; align-items: center; height: 42px; padding-left: 14px; flex-shrink: 0; }
  .title .name { display: flex; align-items: center; gap: 8px; font-weight: 600; pointer-events: none; }
  .title .name img { width: 20px; height: 20px; }
  .title .grow { flex: 1; align-self: stretch; }
  .wb { display: flex; align-self: stretch; }
  .wb div { width: 46px; display: grid; place-items: center; font-size: 15px; cursor: pointer; transition: background .15s; }
  .wb div:hover { background: var(--panel-hover); }
  .wb .close:hover { background: var(--g3); color: #fff; }

  .body { flex: 1; display: flex; min-height: 0; }
  .side { width: 240px; flex-shrink: 0; padding: 4px 10px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .me { display: flex; align-items: center; gap: 12px; padding: 10px 10px 16px; }
  .me .avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--g1-soft), var(--g2-soft)); display: grid; place-items: center;
    font-size: 20px; font-weight: 700; color: #3d2440; box-shadow: 0 4px 12px color-mix(in srgb, var(--shade) 25%, transparent); }
  .me b { display: block; font-size: 14px; }
  .me small { color: var(--text-2); }
  .side .field { margin: 0 2px 10px; height: 36px; }
  .nav { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; position: relative; }
  .nav i { font-size: 18px; color: var(--text-2); transition: transform .35s var(--spring), color .2s; }
  .nav:hover i { transform: scale(1.15) rotate(-6deg); }
  .nav.on { background: var(--hi); box-shadow: inset 0 0 0 1px var(--border); }
  .nav.on i { color: var(--ice-strong); }
  .nav.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--ice-strong); }

  .main { flex: 1; min-width: 0; overflow-y: auto; padding: 6px 28px 30px 18px; }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 18px; letter-spacing: -.3px; }
  h2 { font-size: 13px; font-weight: 600; margin: 22px 2px 8px; color: var(--text-2); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } }
  .page { animation: pageIn .4s var(--smooth); }
  .page > *, .grid > * { animation: rise .45s var(--smooth) backwards; animation-delay: calc(var(--i, 0) * 25ms); }

  /* setting rows */
  .row { display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 10px 16px; margin-bottom: 4px; border-radius: 12px;
    background: var(--hi); border: 1px solid var(--border); }
  .row > i { font-size: 22px; color: var(--text-2); flex-shrink: 0; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-weight: 500; font-size: 14px; }
  .row .txt small { display: block; color: var(--text-2); margin-top: 2px; }
  .row.link { cursor: pointer; transition: background .15s, transform .3s var(--spring); }
  .row.link:hover { background: var(--panel-hover); transform: translateX(3px); }
  .row.link .go { color: var(--text-2); font-size: 15px; }

  /* switch */
  .sw { width: 42px; height: 22px; border-radius: 11px; border: 1px solid var(--text-2); position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s, border-color .2s; }
  .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 12px; height: 12px; border-radius: 6px; background: var(--text-2);
    transition: transform .45s var(--spring), background .15s, width .2s; }
  .sw:active::after { width: 16px; }
  .sw.on { background: var(--ice-strong); border-color: var(--ice-strong); }
  .sw.on::after { transform: translateX(20px); background: var(--on-ice); }
  .sw.on:active::after { transform: translateX(16px); }

  /* segmented choice */
  .seg { display: flex; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); position: relative; flex-shrink: 0; }
  .seg div { position: relative; z-index: 1; padding: 6px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: color .2s; }
  .seg .knob { position: absolute; z-index: 0; top: 3px; bottom: 3px; border-radius: 8px; background: var(--ice-strong); transition: left .4s var(--spring), width .4s var(--spring); }
  .seg div.on { color: var(--on-ice); }

  /* sliders */
  .range { width: 220px; height: 4px; border-radius: 2px; background: var(--pink); position: relative; cursor: pointer; touch-action: none; flex-shrink: 0; }
  .range::before { content: ""; position: absolute; inset: -10px 0; }
  .range .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--ice-strong); }
  .range .knob { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--hi);
    border: 4px solid var(--ice-strong); transition: transform .25s var(--spring); }
  .range:active .knob { transform: scale(1.35); }
  .val { width: 34px; text-align: right; color: var(--text-2); }

  .btn { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--border); background: var(--panel); font: inherit; color: var(--text); cursor: pointer;
    transition: background .15s, transform .2s var(--spring); white-space: nowrap; }
  .btn:hover { background: var(--panel-hover); }
  .btn:active { transform: scale(.95); }
  .btn.primary { background: var(--ice-strong); border-color: var(--ice-strong); color: var(--on-ice); }
  .btn.danger { background: var(--g3); border-color: var(--g3); color: #fff; }

  /* home */
  .hero { display: flex; align-items: center; gap: 20px; padding: 22px; border-radius: 18px; margin-bottom: 18px; position: relative; overflow: hidden;
    background: linear-gradient(120deg, color-mix(in srgb, var(--g1) 45%, transparent), color-mix(in srgb, var(--g2) 40%, transparent)); border: 1px solid var(--border); }
  .hero .pc { width: 110px; height: 72px; border-radius: 10px; border: 4px solid var(--hi); background: linear-gradient(135deg, var(--g1), var(--g2));
    box-shadow: 0 8px 22px color-mix(in srgb, var(--shade) 30%, transparent); position: relative; flex-shrink: 0; }
  .hero .pc::after { content: ""; position: absolute; left: 35%; right: 35%; bottom: -14px; height: 10px; border-radius: 0 0 6px 6px; background: var(--hi); }
  .hero b { font-size: 20px; display: block; }
  .hero small { color: var(--text-2); display: block; margin-top: 3px; }
  .hero .cloud { position: absolute; right: -30px; top: -40px; font-size: 180px; opacity: .18; animation: drift 9s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes drift { to { transform: translate(-30px, 14px) rotate(-6deg); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--hi); border: 1px solid var(--border); cursor: pointer; }
  .card .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0;
    background: linear-gradient(160deg, var(--g1-soft), var(--pink-deep)); color: var(--text); }
  .card:nth-child(3n+2) .ic { background: linear-gradient(160deg, var(--g2-soft), color-mix(in srgb, var(--g2) 60%, var(--g2-soft))); }
  .card:nth-child(3n) .ic { background: linear-gradient(160deg, var(--g1-soft), color-mix(in srgb, var(--g3) 45%, var(--g1-soft))); }
  .card b { font-weight: 500; display: block; }
  .card small { color: var(--text-2); display: block; font-size: 11px; margin-top: 1px; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .qk { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--hi); border: 1px solid var(--border); cursor: pointer;
    transition: background .2s, border-color .2s, transform .3s var(--spring); }
  .qk i { font-size: 22px; }
  .qk.on { background: var(--ice-strong); border-color: var(--ice-strong); color: var(--on-ice); }
  .qk:active { transform: scale(.95); }

  /* pinned apps list */
  .pin img { width: 26px; height: 26px; flex-shrink: 0; }
  .mini { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--text-2); transition: background .15s; }
  .mini:hover { background: var(--panel-hover); color: var(--text); }
  .usage { height: 6px; border-radius: 3px; background: var(--pink); overflow: hidden; margin-top: 6px; width: 240px; }
  .usage span { display: block; height: 100%; background: var(--ice-strong); border-radius: 3px; }
  /* color theme cards: a tiny scene in each theme's colors */
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .theme { cursor: pointer; text-align: center; padding: 8px 8px 10px; border-radius: 16px; border: 2px solid transparent; }
  .theme.on { border-color: var(--ice-strong); background: var(--hi); box-shadow: 0 0 18px color-mix(in srgb, var(--ice-strong) 35%, transparent); }
  .theme b { display: block; margin-top: 8px; font-weight: 500; }
  .theme .scene { position: relative; }
  .theme .badge { position: absolute; right: 8px; top: 8px; font-size: 16px; color: #fff; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .4)); }
  input.swatch { width: 38px; height: 34px; border: 1px solid var(--border); border-radius: 10px; padding: 2px; background: var(--panel); cursor: pointer; }
  input.textbox { height: 34px; border-radius: 17px; border: 1px solid var(--border); background: var(--panel); padding: 0 14px; font: inherit; color: var(--text); width: 220px; outline: none; }
  code { font-family: Consolas, monospace; padding: 6px 10px; border-radius: 8px; background: var(--hi); border: 1px solid var(--border); user-select: all; }
  .scene { position: relative; height: 84px; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  .scene .mini { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 5px; }
  .scene .mini span { width: 14px; height: 14px; border-radius: 5px; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .scene .stars { position: absolute; inset: 0;
    background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 45% 60%, #cfe, transparent),
      radial-gradient(1px 1px at 85% 55%, #fff, transparent), radial-gradient(1px 1px at 10% 70%, #fcf, transparent), radial-gradient(1px 1px at 60% 85%, #fff, transparent);
    animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .5; } }
  .lead { color: var(--text-2); margin: -4px 0 14px; line-height: 1.45; }
  .achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .ach { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--hi); border: 1px solid var(--border); opacity: .62; }
  .ach.on { opacity: 1; border-color: color-mix(in srgb, #f5c542 55%, var(--border)); }
  .ach .medal { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 20px; color: var(--text-2); background: var(--panel); border: 1px dashed var(--border); }
  .ach.on .medal { color: #fff; border: 0; background: radial-gradient(circle at 35% 30%, #fff3b0, #f5c542 45%, #e08a1e); box-shadow: 0 4px 14px rgba(245, 197, 66, .45); }
  .ach b { display: block; font-size: 13px; } .ach small { display: block; color: var(--text-2); font-size: 12px; margin-top: 2px; }
  .ach .bar { height: 4px; border-radius: 2px; background: var(--panel); margin-top: 6px; overflow: hidden; }
  .ach .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--g1), var(--g2)); border-radius: 2px; }
  ul.news { margin: 0 0 8px; padding-left: 20px; line-height: 1.55; }
  textarea.report { width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel);
    font: inherit; color: var(--text); outline: none; margin-bottom: 8px; user-select: text; }
  textarea.report:focus { border-color: var(--ice-strong); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  details.peek { margin-top: 6px; color: var(--text-2); } details.peek summary { cursor: pointer; }
  details.peek pre { white-space: pre-wrap; font-size: 11px; max-height: 220px; overflow: auto; padding: 10px; border-radius: 10px; background: var(--hi); user-select: text; }
  .info { display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; padding: 16px 18px; border-radius: 12px; background: var(--hi); border: 1px solid var(--border); }
  .info span:nth-child(odd) { color: var(--text-2); }
  .empty { padding: 50px 20px; text-align: center; color: var(--text-2); }
  .empty i { font-size: 40px; display: block; margin-bottom: 8px; opacity: .6; }
</style>
</head>
<body>
<div class="win appwin" id="win">
  <div class="title" data-tauri-drag-region>
    <div class="name"><img id="appIcon" alt="">Settings</div>
    <div class="grow" data-tauri-drag-region></div>
    <div class="wb">
      <div id="minBtn" title="Minimize"><i class="ph ph-minus"></i></div>
      <div id="maxBtn" title="Maximize"><i class="ph ph-square"></i></div>
      <div class="close" id="closeBtn" title="Close"><i class="ph ph-x"></i></div>
    </div>
  </div>
  <div class="body">
    <div class="side">
      <div class="me"><div class="avatar" id="avatar"></div><div><b id="uname"></b><small id="pcname"></small></div></div>
      <label class="field"><i class="ph ph-magnifying-glass"></i><input id="q" placeholder="Find a setting" spellcheck="false"></label>
      <div id="navs"></div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<script src="shared.js"></script>
<script src="changes.js"></script>
<script>
  const appWindow = window.__TAURI__.window.getCurrentWindow();
  const PAGES = [
    ["home", "Home", "ph-house-line"],
    ["look", "Look and feel", "ph-paint-brush"],
    ["taskbar", "Taskbar", "ph-app-window"],
    ["widgets", "Widgets", "ph-squares-four"],
    ["notifications", "Notifications", "ph-bell"],
    ["idle", "Idle screen", "ph-cloud-moon"],
    ["sound", "Sound", "ph-speaker-high"],
    ["network", "Network and devices", "ph-wifi-high"],
    ["apps", "Apps", "ph-squares-four"],
    ["system", "System", "ph-desktop"],
    ["focus", "Focus", "ph-target"],
    ["achievements", "Achievements", "ph-trophy"],
    ["news", "What's new", "ph-sparkle"],
    ["report", "Something's wrong?", "ph-bug"],
    ["about", "About", "ph-info"],
  ];
  // bug reports go to this address (the friend presses Send in their own mail app or Gmail)
  const REPORT_TO = "notunisthegoat@gmail.com";
  // color themes: id, name, and the colors of their little preview scene
  const PALETTES = [
    ["pink", "Pink Cloud", "linear-gradient(135deg, #fbd3e0, #c9a8e6 60%, #9cc9ec)", "#f2a6c0", "#8cc6e6"],
    ["lavender", "Lavender", "linear-gradient(135deg, #eadcff, #c4b2f2 55%, #9fc4ef)", "#c4a7f2", "#9cc4f2"],
    ["mint", "Mint", "linear-gradient(135deg, #d8f7ea, #a9dccf 55%, #f4c6d4)", "#8fe0c2", "#f6b8cb"],
    ["sunset", "Sunset", "linear-gradient(135deg, #ffe2c4, #ffad8a 45%, #f79bb5 75%, #b98bd8)", "#ffb38a", "#f78bb0"],
    ["cosmos", "Cosmos", "radial-gradient(60% 60% at 30% 35%, #6d3fe0aa, transparent 70%), radial-gradient(50% 50% at 75% 70%, #22d3ee66, transparent 70%), linear-gradient(160deg, #0b0a24, #120c33 50%, #05081c)", "#a78bfa", "#22d3ee"],
    ["grove", "Grove", "linear-gradient(115deg, transparent 45%, #f3dd7244 52%, transparent 60%), radial-gradient(60% 50% at 50% 110%, #5abe3c99, transparent 70%), linear-gradient(170deg, #1a5a2a, #0b2a16 55%, #061a0d)", "#8fdc5a", "#3ff0c0"],
  ];
  let page = "home";
  let info = null, drives = [], apps = [], appQuery = "";

  const winSettings = page => { invoke("launch", { path: "ms-settings:" + page }); };
  const h = (tag, cls, text) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, text !== undefined ? { textContent: text } : {});

  // ---------- building blocks ----------
  function row(icon, title, desc, control) {
    const r = h("div", "row");
    r.dataset.find = (title + " " + (desc || "")).toLowerCase();
    r.append(h("i", "ph " + icon));
    const t = h("div", "txt"); t.append(h("b", "", title)); if (desc) t.append(h("small", "", desc));
    r.append(t);
    if (control) r.append(control);
    return r;
  }
  function linkRow(icon, title, desc, action) {
    const r = row(icon, title, desc, h("i", "ph ph-caret-right go"));
    r.classList.add("link");
    r.onclick = action;
    return r;
  }
  function toggle(on, change) {
    const s = h("div", "sw" + (on ? " on" : ""));
    s.onclick = () => { s.classList.toggle("on"); change(s.classList.contains("on"), s); };
    return s;
  }
  function choice(options, current, change) {
    const s = h("div", "seg"), knob = h("div", "knob");
    s.append(knob);
    const place = el => { knob.style.left = el.offsetLeft + "px"; knob.style.width = el.offsetWidth + "px"; };
    options.forEach(([value, label]) => {
      const o = h("div", value === current ? "on" : "", label);
      o.onclick = () => { s.querySelectorAll("div:not(.knob)").forEach(x => x.classList.remove("on")); o.classList.add("on"); place(o); change(value); };
      s.append(o);
    });
    requestAnimationFrame(() => { const on = s.querySelector(".on"); if (on) { knob.style.transition = "none"; place(on); requestAnimationFrame(() => knob.style.transition = ""); } });
    return s;
  }
  function slider(value, change) {
    const r = h("div", "range"), fill = h("div", "fill"), knob = h("div", "knob");
    r.append(fill, knob);
    const set = v => { fill.style.width = knob.style.left = Math.round(v * 100) + "%"; };
    set(value);
    let drag = false;
    const move = e => { const b = r.getBoundingClientRect(); const v = Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)); set(v); change(v); };
    r.onpointerdown = e => { drag = true; r.setPointerCapture(e.pointerId); move(e); };
    r.onpointermove = e => { if (drag) move(e); };
    r.onpointerup = () => drag = false;
    return r;
  }
  function card(icon, title, desc, action) {
    const c = h("div", "card tilt");
    c.innerHTML = `<div class="ic"><i class="ph-fill ${icon}"></i></div><div><b></b><small></small></div>`;
    c.querySelector("b").textContent = title;
    c.querySelector("small").textContent = desc;
    c.onclick = action;
    return c;
  }
  const size = n => n >= 1e12 ? (n / 1e12).toFixed(1) + " TB" : (n / 1e9).toFixed(0) + " GB";

  // shared Pink Cloud preferences (the other screens pick up changes right away)
  const prefs = {
    theme: () => store.get("pc-theme", "auto"),
    vis: () => store.get("pc-vis", "big"),
    lyrics: () => store.get("pc-lyrics", true),
    player: () => store.get("pc-np", true),
  };
  const setTheme = v => { store.set("pc-theme", v); applyTheme(); };

  // ---------- pages ----------
  const build = {
    async home(m) {
      const hero = h("div", "hero");
      hero.innerHTML = `<div class="pc"></div><div><b></b><small></small><small></small></div><i class="ph-fill ph-cloud cloud"></i>`;
      const [b, s1, s2] = hero.querySelectorAll("b, small");
      b.textContent = info ? info.pc_name : "";
      s1.textContent = info ? `${info.windows} · ${info.version}` : "";
      s2.textContent = info ? `${info.cpu} · ${info.ram_gb} GB memory` : "";
      m.append(hero);

      m.append(h("h2", "", "Quick switches"));
      const q = h("div", "quick");
      const quick = (icon, label, on, flip) => {
        const k = h("div", "qk" + (on ? " on" : ""));
        k.innerHTML = `<i class="ph ${icon}"></i><span></span>`;
        k.querySelector("span").textContent = label;
        k.onclick = () => { k.classList.toggle("on"); flip(k.classList.contains("on")); };
        q.append(k);
      };
      quick("ph-moon-stars", "Dark mode", currentTheme() === "dark", on => setTheme(on ? "dark" : "light"));
      quick("ph-waveform", "Visualizer", prefs.vis() !== "off", on => store.set("pc-vis", on ? "big" : "off"));
      quick("ph-microphone-stage", "Lyrics", prefs.lyrics(), on => store.set("pc-lyrics", on));
      quick("ph-music-notes", "Music player", prefs.player(), on => store.set("pc-np", on));
      const auto = await invoke("get_autostart");
      quick("ph-rocket-launch", "Start with Windows", auto, on => invoke("set_autostart", { on }));
      m.append(q);

      m.append(h("h2", "", "Windows settings"));
      const g = h("div", "grid");
      [
        ["ph-monitor", "Display", "Brightness, resolution, scale", "display"],
        ["ph-speaker-high", "Sound", "Output, input, volume", "sound"],
        ["ph-bluetooth", "Bluetooth and devices", "Headphones, mouse, printers", "bluetooth"],
        ["ph-wifi-high", "Network and internet", "Wi-Fi, VPN, data usage", "network"],
        ["ph-paint-brush", "Personalization", "Wallpaper, colors, cursor", "personalization"],
        ["ph-squares-four", "Apps", "Installed apps, defaults", "appsfeatures"],
        ["ph-user-circle", "Accounts", "Your info, sign-in options", "accounts"],
        ["ph-clock", "Time and language", "Date, time, region", "dateandtime"],
        ["ph-game-controller", "Gaming", "Game mode, captures", "gaming-gamemode"],
        ["ph-person-arms-spread", "Accessibility", "Text size, magnifier", "easeofaccess"],
        ["ph-shield-check", "Privacy and security", "Permissions, security", "privacy"],
        ["ph-arrows-clockwise", "Windows Update", "Updates, update history", "windowsupdate"],
      ].forEach(([ic, t, d, p]) => g.append(card(ic, t, d, () => winSettings(p))));
      m.append(g);
    },

    async look(m) {

      m.append(row("ph-sign-out", "Close Pink Cloud", "The normal Windows taskbar comes back until you start Pink Cloud again", quit));
      const ws = h("button", "btn", "Open");
      ws.onclick = () => winSettings("");
      m.append(row("ph-gear-six", "Windows Settings", "Everything Windows has, in its own app", ws));
    },
  };

  Object.assign(build, {
    // ---------- focus mode ----------
    focus(m) {
      const f = focusState();
      const go = h("button", "btn primary", f ? "End focus" : "Start focus");
      go.onclick = () => { f ? stopFocus(false) : startFocus(); show("focus"); };
      m.append(row("ph-target", f ? (f.until ? `Focusing, ${Math.max(1, Math.ceil((f.until - Date.now()) / 60000))} min left` : "Focusing, no timer") : "Focus mode",
        "Notifications wait, lyrics step aside, and the taskbar counts down. Also in quick settings and quick search", go));
      m.append(row("ph-timer", "Session length", "When it's over you get a little card, and the notifications you missed",
        choice([[15, "15 min"], [25, "25 min"], [45, "45 min"], [60, "1 hour"], [0, "No timer"]], store.get("pc-focus-minutes", 25), v => store.set("pc-focus-minutes", v))));
      m.append(row("ph-bell-slash", "Hold notifications", "Pop-ups wait until you're done; they're still in the notification panel",
        toggle(store.get("pc-focus-quiet", true), on => store.set("pc-focus-quiet", on))));
      m.append(row("ph-microphone-stage", "Lyrics while focusing", "Off keeps the screen calm",
        toggle(store.get("pc-focus-lyrics", false), on => store.set("pc-focus-lyrics", on))));
      const prog = store.get("pc-ach-progress", {});
      m.append(row("ph-brain", "Time in focus", `${Math.floor((prog.deepfocus || 0) / 60)} h ${(prog.deepfocus || 0) % 60} min so far`));
    },

    // ---------- achievements ----------
    achievements(m) {
      const got = achieved(), prog = store.get("pc-ach-progress", {});
      const n = ACHIEVEMENTS.filter(a => got[a[0]]).length;
      m.append(h("p", "lead", `${n} of ${ACHIEVEMENTS.length} unlocked`));
      const g = h("div", "achs");
      ACHIEVEMENTS.forEach(([id, name, desc, icon, goal]) => {
        const on = !!got[id], c = h("div", "ach" + (on ? " on" : ""));
        const secret = id === "time" && !on;
        c.innerHTML = `<div class="medal"><i class="ph-fill ${secret ? "ph-question" : icon}"></i></div><div><b></b><small></small><div class="bar"><span></span></div></div>`;
        c.querySelector("b").textContent = secret ? "???" : name;
        c.querySelector("small").textContent = on ? `${desc} · ${new Date(got[id]).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}` : desc;
        const bar = c.querySelector(".bar");
        if (on || goal === 1) bar.remove(); else bar.firstChild.style.width = Math.min(100, (prog[id] || 0) / goal * 100) + "%";
        if (!on && goal > 1) c.querySelector("small").textContent += ` (${Math.min(prog[id] || 0, goal)}/${goal})`;
        g.append(c);
      });
      m.append(g);
    },

    // ---------- what's new ----------
    news(m) {
      CHANGES.forEach(([v, items]) => {
        m.append(h("h2", "", "Pink Cloud " + v));
        const ul = h("ul", "news");
        items.forEach(t => ul.append(h("li", "", t)));
        m.append(ul);
      });
      m.append(linkRow("ph-map-trifold", "Take the welcome tour again", "Themes, start with Windows and the handy shortcuts", () => invoke("open_tour")));
    },

    // ---------- bug reports ----------
    async report(m) {
      const crash = await invoke("crash_report");
      m.append(h("p", "lead", "Tell what happened, then send it. The report opens as an email to the Pink Cloud team in Gmail or your mail app, so you can read it and press Send."));
      const ta = h("textarea", "report");
      ta.placeholder = "What went wrong? What were you doing when it happened?";
      ta.value = store.get("pc-report-draft", "");
      ta.oninput = () => store.set("pc-report-draft", ta.value);
      m.append(ta);
      let withDetails = true;
      m.append(row("ph-cpu", "Include technical details", "Pink Cloud's version, your Windows version and PC, and the last error messages. No files, passwords or personal stuff",
        toggle(true, on => withDetails = on)));
      const details = await invoke("report_details");
      const full = () => [ta.value.trim() || "(no description)", withDetails ? "\n---\n" + details : "", crash ? "\n---\nCrash:\n" + crash : ""].join("\n");
      const subject = () => "Pink Cloud bug: " + (ta.value.trim().split("\n")[0].slice(0, 60) || "something's wrong");
      const sent = () => { achieve("helper"); invoke("dismiss_crash"); store.set("pc-report-draft", ""); };
      const acts = h("div", "acts");
      const gmail = h("button", "btn primary", "Send with Gmail");
      gmail.onclick = () => {
        invoke("launch", { path: `https://mail.google.com/mail/?view=cm&fs=1&to=${REPORT_TO}&su=${encodeURIComponent(subject())}&body=${encodeURIComponent(full().slice(0, 6000))}` });
        sent();
      };
      const mail = h("button", "btn", "Send with my mail app");
      mail.onclick = () => {
        invoke("launch", { path: `mailto:${REPORT_TO}?subject=${encodeURIComponent(subject())}&body=${encodeURIComponent(full().slice(0, 1800))}` });
        sent();
      };
      const copy = h("button", "btn", "Copy report");
      copy.onclick = () => navigator.clipboard.writeText(`To: ${REPORT_TO}\nSubject: ${subject()}\n\n${full()}`).then(() => copy.textContent = "Copied ✓");
      acts.append(gmail, mail, copy);
      m.append(acts);
      if (crash) m.append(row("ph-warning-circle", "A crash report is included", "Pink Cloud closed unexpectedly last time; that report goes with this one"));
      const peek = h("details", "peek");
      peek.append(h("summary", "", "See what's sent"), h("pre", "", details + (crash ? "\n\n" + crash : "")));
      m.append(peek);
    },
  });

  // ---------- navigation and search ----------
  function renderNav() {
    navs.innerHTML = "";
    PAGES.forEach(([id, label, icon]) => {
      const n = h("div", "nav ctl" + (id === page ? " on" : ""));
      n.innerHTML = `<i class="ph ${icon}"></i><span></span>`;
      n.querySelector("span").textContent = label;
      n.onclick = () => { q.value = ""; show(id); };
      navs.append(n);
    });
  }
  async function show(id) {
    page = id;
    renderNav();
    const m = h("div", "page");
    m.append(h("h1", "", PAGES.find(p => p[0] === id)[1]));
    await build[id](m);
    [...m.children].forEach((c, i) => c.style.setProperty("--i", Math.min(i, 20)));
    m.querySelectorAll(".grid > *").forEach((c, i) => c.style.setProperty("--i", i));
    main.innerHTML = "";
    main.append(m);
    main.scrollTop = 0;
  }
  // searching shows matching settings from every page
  q.addEventListener("input", async () => {
    const t = q.value.trim().toLowerCase();
    if (!t) return show(page === "search" ? "home" : page);
    const m = h("div", "page");
    m.append(h("h1", "", "Results"));
    for (const [id, label] of PAGES) {
      if (id === "home" || id === "apps") continue;
      const holder = h("div");
      await build[id](holder);
      const hits = [...holder.querySelectorAll(".row")].filter(r => r.dataset.find && r.dataset.find.includes(t));
      if (hits.length) { m.append(h("h2", "", label)); hits.forEach(r => m.append(r)); }
    }
    if (m.children.length === 1) m.append(h("div", "empty", "No settings match that. Try other words."));
    navs.querySelectorAll(".nav").forEach(n => n.classList.remove("on"));
    main.innerHTML = ""; main.append(m);
  });

  // ---------- window: zooms up when it opens, dissolves when it closes ----------
  minBtn.onclick = () => appWindow.minimize();
  maxBtn.onclick = () => appWindow.toggleMaximize();
  closeBtn.onclick = () => closeAppWindow(win, appWindow);
  appWindow.onResized(async () => { maxBtn.innerHTML = `<i class="ph ${(await appWindow.isMaximized()) ? "ph-copy-simple" : "ph-square"}"></i>`; });
  listen("settings-open", ({ payload }) => { openAppWindow(win); if (payload) show(payload); });
  addEventListener("storage", e => { if ((["pc-theme", "pc-vis", "pc-lyrics", "pc-np", "pc-pins", "pc-update"].includes(e.key) || (e.key === "pc-ach" && page === "achievements") || (e.key === "pc-focus" && page === "focus")) && !q.value) show(page); });

  iconFor("C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe").then(u => { if (u) appIcon.src = u; });
  invoke("user_name").then(n => { uname.textContent = n; avatar.textContent = (n[0] || "?").toUpperCase(); });
  (async () => {
    info = await invoke("sys_info");
    pcname.textContent = info.pc_name;
    show("home");
  })();
</script>
</body>
</html>
