<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { font-size: 13px; }
  .win { height: 100%; display: flex; flex-direction: column; background: var(--panel); border-radius: 10px; overflow: hidden; }
  @keyframes winIn { from { opacity: 0; transform: translateY(14px) scale(.97); filter: blur(6px); } }
  .win.open { animation: winIn .45s var(--smooth); }

  /* title bar with tabs */
  .title { display: flex; align-items: center; height: 42px; padding-left: 12px; flex-shrink: 0; gap: 8px; }
  .title .name { display: flex; align-items: center; pointer-events: none; }
  .tabs { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; align-self: stretch; padding-top: 6px; }
  .tab { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 12px; border-radius: 10px 10px 0 0; max-width: 200px; min-width: 90px;
    cursor: default; position: relative; transition: background .15s; animation: tabIn .4s var(--spring); }
  @keyframes tabIn { from { opacity: 0; transform: translateY(8px) scale(.9); } }
  .tab:hover { background: var(--panel-hover); }
  .tab.on { background: var(--hi); box-shadow: 0 -1px 0 var(--border) inset; }
  .tab i.ic { color: var(--g1); font-size: 15px; flex-shrink: 0; }
  .tab span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; opacity: 0; flex-shrink: 0; }
  .tab:hover .x, .tab.on .x { opacity: .7; }
  .tab .x:hover { background: var(--panel-hover); opacity: 1; }
  .tab.drop { background: var(--ice); }
  .newtab { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; flex-shrink: 0; font-size: 15px; color: var(--text-2); }
  .title .grow { flex: 1; align-self: stretch; }
  .wb { display: flex; align-self: stretch; }
  .wb div { width: 46px; display: grid; place-items: center; font-size: 15px; cursor: pointer; transition: background .15s; }
  .wb div:hover { background: var(--panel-hover); }
  .wb .close:hover { background: var(--g3); color: #fff; }

  /* navigation row */
  .navrow { display: flex; align-items: center; gap: 4px; padding: 8px 10px; flex-shrink: 0; background: var(--hi); }
  .nb { width: 34px; height: 34px; display: grid; place-items: center; font-size: 16px; color: var(--text-2); }
  .nb.off { opacity: .35; pointer-events: none; }
  .crumbs { flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 17px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--border); cursor: text; }
  .crumbs .seg { padding: 4px 8px; border-radius: 12px; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .crumbs .seg:hover { background: var(--panel-hover); }
  .crumbs .seg.drop { background: var(--ice); }
  .crumbs .seg:last-child { font-weight: 600; }
  .crumbs > i { color: var(--text-2); font-size: 11px; flex-shrink: 0; }
  .crumbs input { flex: 1; border: 0; outline: none; background: none; font: inherit; color: var(--text); padding: 0 8px; }
  .crumbs.editing { border-color: var(--ice-strong); box-shadow: 0 0 0 1px var(--ice-strong); }
  .navrow .field { height: 34px; width: 230px; flex-shrink: 0; }

  /* command bar */
  .cmd { display: flex; align-items: center; gap: 2px; padding: 0 10px 8px; flex-shrink: 0; background: var(--hi); }
  .cmd .ctl { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; white-space: nowrap; }
  .cmd .ctl i { font-size: 17px; }
  .cmd .ctl.primary { background: var(--pink); }
  .cmd .ctl.primary:hover { background: var(--pink-deep); }
  .cmd .ctl.off { opacity: .4; pointer-events: none; }
  .cmd .ctl.on { background: var(--ice); color: var(--ice-strong); }
  .vsep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
  .cmd .grow { flex: 1; }

  /* body */
  .body { flex: 1; display: flex; min-height: 0; background: var(--hi); border-top: 1px solid var(--border); }
  .side { width: 200px; flex-shrink: 0; padding: 8px; overflow-y: auto; border-right: 1px solid var(--border); }
  .side .ctl { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; position: relative; white-space: nowrap; overflow: hidden; }
  .side .ctl i { font-size: 17px; color: var(--text-2); }
  .side .ctl span { overflow: hidden; text-overflow: ellipsis; }
  .side .ctl.on { background: var(--ice); }
  .side .ctl.on::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--ice-strong); }
  .side .ctl.on i { color: var(--ice-strong); }
  .side .ctl.drop { background: var(--ice); box-shadow: inset 0 0 0 1px var(--ice-strong); }
  .side .lbl { font-size: 11px; font-weight: 600; color: var(--text-2); padding: 12px 10px 4px; }
  .side .drive { flex-direction: column; align-items: stretch; height: auto; padding: 7px 10px; gap: 5px; }
  .side .drive .top { display: flex; align-items: center; gap: 10px; }
  .usage { height: 4px; border-radius: 2px; background: var(--pink); overflow: hidden; }
  .usage span { display: block; height: 100%; background: var(--ice-strong); border-radius: 2px; }
  .usage.full span { background: #e0708f; }

  .main { flex: 1; min-width: 0; overflow-y: auto; padding: 0 14px 20px; position: relative; outline: none; user-select: none; }
  .main::-webkit-scrollbar, .side::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb, .side::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateX(var(--from, 0)); } }
  .main.nav .content { animation: fadeSlide .35s var(--smooth); }

  /* sort bar: always there, one click to sort, again to flip */
  .sortbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 10px 14px 8px; margin: 0 -14px;
    background: color-mix(in srgb, var(--g1-soft) 14%, rgba(255, 250, 252, .97)); box-shadow: 0 6px 12px -8px color-mix(in srgb, var(--shade) 40%, transparent); }
  :root[data-theme="dark"] .sortbar { background: color-mix(in srgb, var(--g1-soft) 18%, rgba(22, 15, 28, .97)); }
  .sortbar .chip { display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel);
    font-size: 12px; cursor: pointer; transition: background .15s, transform .25s var(--spring), border-color .15s; white-space: nowrap; }
  .sortbar .chip:hover { background: var(--panel-hover); }
  .sortbar .chip:active { transform: scale(.94); }
  .sortbar .chip.on { background: var(--ice); border-color: color-mix(in srgb, var(--ice-strong) 55%, transparent); color: var(--ice-strong); font-weight: 600; }
  .sortbar .chip i { font-size: 13px; transition: transform .35s var(--spring); }
  .sortbar .chip.down i.dir { transform: rotate(180deg); }
  .sortbar .sp { flex: 1; }
  .sortbar .chip.opt { color: var(--text-2); }
  .sortbar .chip.opt.on { color: var(--ice-strong); }

  /* groups: Today, Yesterday… or Folders, Pictures, Videos… */
  .ghead { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 12px 2px 6px; cursor: pointer; }
  .ghead::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .ghead small { font-weight: 400; }
  .ghead i { transition: transform .3s var(--spring); }
  .ghead.shut i { transform: rotate(-90deg); }

  /* grid view */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 112px), 1fr)); gap: 6px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 12px; text-align: center; position: relative; }
  .tile .pic { width: calc(var(--tile, 112px) * .57); height: calc(var(--tile, 112px) * .57); display: grid; place-items: center; }
  .tile .pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tile .pic img.thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; box-shadow: 0 2px 8px color-mix(in srgb, var(--shade) 25%, transparent); }
  .tile .name { width: 100%; font-size: 12px; line-height: 1.3; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .folder { width: 90%; height: 80%; display: grid; place-items: center; font-size: calc(var(--tile, 112px) * .46); color: var(--g1); filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--g1) 35%, transparent)); transition: transform .35s var(--spring); }
  .folder i { background: linear-gradient(160deg, var(--g1-soft), var(--g1) 55%, var(--g3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tile:hover .folder, .row:hover .folder { transform: translateY(-2px) rotate(-3deg) scale(1.05); }
  .item.drop .folder { transform: scale(1.18) rotate(-6deg); }

  /* list view */
  .list { display: flex; flex-direction: column; }
  .lhead, .row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 130px 90px; align-items: center; gap: 10px; }
  .lhead { height: 28px; padding: 0 10px; font-size: 12px; color: var(--text-2); }
  .lhead span { cursor: pointer; }
  .lhead span:hover { color: var(--text); }
  .lhead span.on { color: var(--ice-strong); font-weight: 600; }
  .row { height: 34px; padding: 0 10px; border-radius: 8px; }
  .row .nm { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .row .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
  .row .nm img.thumb { object-fit: cover; border-radius: 4px; }
  .row .folder { width: 20px; height: 20px; font-size: 20px; filter: none; }
  .row > span:not(.nm) { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row > span.size { text-align: right; }

  .item { cursor: default; transition: background .12s; }
  .item:hover { background: var(--panel-hover); }
  .item.sel { background: var(--ice); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ice-strong) 45%, transparent); }
  .item.drop { background: var(--ice); box-shadow: inset 0 0 0 2px var(--ice-strong); }
  .item.hid { opacity: .55; }
  .item.cutting { opacity: .45; }
  .item.dragging { opacity: .4; }
  .item.landed { animation: landed .7s var(--spring); }
  @keyframes landed { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); background: var(--ice); } }
  .item input.rename { width: 100%; font: inherit; color: var(--text); background: var(--hi); border: 1px solid var(--ice-strong); border-radius: 6px; padding: 2px 6px; outline: none; text-align: inherit; user-select: text; }
  .main.enter .item { animation: rise .4s var(--smooth) backwards; animation-delay: calc(var(--i) * 12ms); }

  /* drag a box to select */
  .band { position: absolute; z-index: 4; border: 1px solid var(--ice-strong); background: color-mix(in srgb, var(--ice-strong) 14%, transparent); border-radius: 4px; pointer-events: none; }

  /* home page */
  .h2 { font-size: 13px; font-weight: 600; margin: 14px 4px 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); cursor: pointer;
    transition: transform .3s var(--spring), box-shadow .2s, background .15s; min-width: 0; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px color-mix(in srgb, var(--shade) 18%, transparent); background: var(--panel-hover); }
  .card .glyph { width: 40px; height: 40px; font-size: 21px; flex-shrink: 0; }
  .card > div:last-child { min-width: 0; }
  .card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.drive { flex-direction: column; align-items: stretch; }
  .card.drive .top { display: flex; align-items: center; gap: 12px; }
  .card small { display: block; color: var(--text-2); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card img.thumb { width: 40px; height: 40px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }
  .card img.ico { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; margin: 3px; }
  .main.enter .card { animation: rise .45s var(--smooth) backwards; animation-delay: calc(var(--i) * 30ms); }

  .empty { padding: 60px 20px; text-align: center; color: var(--text-2); }
  .empty i { font-size: 44px; display: block; margin-bottom: 10px; opacity: .6; }

  .status { display: flex; justify-content: space-between; padding: 6px 14px; font-size: 12px; color: var(--text-2); border-top: 1px solid var(--border); background: var(--hi); flex-shrink: 0; }

  /* quick look (Space) */
  .look { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(30, 15, 35, .35); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .look.on { opacity: 1; pointer-events: auto; }
  .look .box { max-width: 86%; max-height: 82%; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: var(--panel-solid, var(--panel)); border: 1px solid var(--border);
    box-shadow: 0 24px 60px rgba(40, 20, 60, .45); transform: scale(.92); transition: transform .4s var(--spring); }
  :root[data-theme="dark"] .look .box { background: rgba(24, 16, 30, .96); }
  :root:not([data-theme="dark"]) .look .box { background: rgba(255, 250, 252, .97); }
  .look.on .box { transform: none; }
  .look .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .look .head b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .look .head small { color: var(--text-2); }
  .look .view { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; }
  .look img, .look video { max-width: 100%; max-height: 70vh; display: block; }
  .look pre { margin: 0; padding: 14px 18px; width: min(820px, 80vw); max-height: 70vh; overflow: auto; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-word; user-select: text; }
  .look audio { margin: 30px 40px; width: 420px; }
  .look iframe { width: min(900px, 80vw); height: 70vh; border: 0; background: #fff; }
  .look .info { padding: 30px 50px; text-align: center; }
  .look .info img { width: 96px; height: 96px; margin: 0 auto 12px; object-fit: contain; }

  /* confirm dialog and toast */
  .shade { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(60, 30, 60, .18); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .shade.on { opacity: 1; pointer-events: auto; }
  .dialog { width: 360px; padding: 22px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(24px) saturate(150%); border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(100, 60, 120, .3); transform: scale(.9) translateY(10px); transition: transform .4s var(--spring); }
  .shade.on .dialog { transform: none; }
  .dialog h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .dialog p { color: var(--text-2); margin-bottom: 18px; line-height: 1.45; }
  .dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--border); background: var(--hi); font: inherit; color: var(--text); cursor: pointer; transition: background .15s, transform .2s var(--spring); }
  .btn:hover { background: var(--panel-hover); }
  .btn:active { transform: scale(.95); }
  .btn.danger { background: var(--g3); border-color: var(--g3); color: #fff; }
  .btn.danger:hover { background: color-mix(in srgb, var(--g3) 85%, black); }
  .toast { position: absolute; left: 50%; bottom: 44px; z-index: 30; padding: 10px 16px; border-radius: 18px; background: var(--panel-solid, var(--panel)); backdrop-filter: blur(20px);
    border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(100,60,120,.25); transform: translate(-50%, 20px); opacity: 0; transition: transform .4s var(--spring), opacity .2s; pointer-events: none; }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div class="win appwin" id="win">
  <div class="title" data-tauri-drag-region>
    <div class="name"><img id="appIcon" alt="" style="width:20px;height:20px"></div>
    <div class="tabs" id="tabsEl"></div>
    <div class="newtab ctl" id="newTabBtn" title="New tab (Ctrl+T)"><i class="ph ph-plus"></i></div>
    <div class="grow" data-tauri-drag-region></div>
    <div class="wb">
      <div id="minBtn" title="Minimize"><i class="ph ph-minus"></i></div>
      <div id="maxBtn" title="Maximize"><i class="ph ph-square"></i></div>
      <div class="close" id="closeBtn" title="Close"><i class="ph ph-x"></i></div>
    </div>
  </div>

  <div class="navrow">
    <div class="nb ctl" id="backBtn" title="Back (Alt+Left)"><i class="ph ph-arrow-left"></i></div>
    <div class="nb ctl" id="fwdBtn" title="Forward (Alt+Right)"><i class="ph ph-arrow-right"></i></div>
    <div class="nb ctl" id="upBtn" title="Up (Backspace)"><i class="ph ph-arrow-up"></i></div>
    <div class="nb ctl" id="refreshBtn" title="Refresh (F5)"><i class="ph ph-arrow-clockwise"></i></div>
    <div class="crumbs" id="crumbs"></div>
    <label class="field"><i class="ph ph-magnifying-glass"></i><input id="filter" placeholder="Search (Enter: subfolders too)" spellcheck="false"></label>
  </div>

  <div class="cmd">
    <div class="ctl primary" id="newBtn" title="New folder (Ctrl+Shift+N)"><i class="ph ph-folder-plus"></i>New folder</div>
    <div class="vsep"></div>
    <div class="ctl" id="cutBtn" title="Cut (Ctrl+X)"><i class="ph ph-scissors"></i></div>
    <div class="ctl" id="copyFilesBtn" title="Copy (Ctrl+C)"><i class="ph ph-copy"></i></div>
    <div class="ctl" id="pasteBtn" title="Paste (Ctrl+V)"><i class="ph ph-clipboard-text"></i></div>
    <div class="vsep"></div>
    <div class="ctl" id="renameBtn" title="Rename (F2)"><i class="ph ph-textbox"></i>Rename</div>
    <div class="ctl" id="copyBtn" title="Copy path (Ctrl+Shift+C)"><i class="ph ph-link"></i>Copy path</div>
    <div class="ctl" id="deleteBtn" title="Move to Recycle Bin (Delete)"><i class="ph ph-trash"></i>Delete</div>
    <div class="ctl" id="lookBtn" title="Quick look (Space)"><i class="ph ph-eye"></i></div>
    <div class="ctl" id="propsBtn" title="Properties"><i class="ph ph-info"></i></div>
    <div class="vsep"></div>
    <div class="ctl" id="explorerBtn" title="Open this folder in Windows File Explorer"><img id="explorerIcon" alt="" style="width:17px;height:17px">Explorer</div>
    <div class="grow"></div>
    <div class="ctl" id="hiddenBtn" title="Show hidden items"><i class="ph ph-eye-slash"></i></div>
    <div class="ctl" id="viewBtn" title="Switch view"><i class="ph ph-squares-four"></i></div>
  </div>

  <div class="body">
    <div class="side" id="side"></div>
    <div class="main" id="main" tabindex="0"></div>
  </div>
  <div class="status"><span id="statusL"></span><span id="statusR"></span></div>
</div>

<div class="shade" id="shade">
  <div class="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="acts"><button class="btn" id="dlgNo">Cancel</button><button class="btn danger" id="dlgYes">Move to Recycle Bin</button></div>
  </div>
</div>
<div class="look" id="look"><div class="box"><div class="head"><b id="lookName"></b><small id="lookInfo"></small></div><div class="view" id="lookView"></div></div></div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
  const appWindow = window.__TAURI__.window.getCurrentWindow();
  const { convertFileSrc } = window.__TAURI__.core;
  const IMAGE = new Set(["png", "jpg", "jpeg", "gif", "webp", "bmp", "avif", "ico", "svg"]);
  const VIDEO = new Set(["mp4", "webm", "mov", "m4v", "mkv"]);
  const AUDIO = new Set(["mp3", "wav", "ogg", "m4a", "flac", "aac", "opus"]);
  const TEXT = new Set(["txt", "md", "log", "json", "js", "ts", "css", "html", "htm", "xml", "csv", "ini", "cfg", "yml", "yaml", "toml", "py", "rs", "lua", "luau", "c", "cpp", "h", "cs", "java", "bat", "cmd", "ps1", "sh", "gitignore", "env"]);
  const OWN_ICON = new Set(["exe", "lnk", "url", "ico", "msi", "appref-ms"]);
  const KINDS = [
    ["Pictures", IMAGE], ["Videos", VIDEO], ["Music", AUDIO],
    ["Documents", new Set(["pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "odt", "rtf", "txt", "md", "csv"])],
    ["Archives", new Set(["zip", "rar", "7z", "tar", "gz", "iso"])],
    ["Apps", new Set(["exe", "msi", "lnk", "url", "bat", "cmd", "appref-ms"])],
  ];

  // ---------- tabs: each keeps its own folder and history ----------
  let tabs = store.get("files-tabs", null) || [{ path: null }];
  tabs = tabs.map(t => ({ path: t.path ?? null, back: [], fwd: [] }));
  let cur = Math.min(store.get("files-tab", 0), tabs.length - 1);
  let path = null;              // null = the Home page
  let back = [], fwd = [];
  let entries = [];
  let shown = [];
  const selected = new Set();
  let anchor = null;
  let places = [], drives = [], recent = [];
  let view = store.get("files-view", "grid");
  let showHidden = store.get("files-hidden", false);
  let tile = store.get("files-tile", 112);
  const ownFiles = () => store.get("pc-own-files", true);

  // ---------- sorting: remembered per folder (Downloads starts newest first) ----------
  const folderKey = p => (p || "").toLowerCase().replace(/\\+$/, "");
  const isDownloads = p => /\\downloads$/i.test((p || "").replace(/\\+$/, ""));
  function sortFor(p) {
    const own = store.get("files-sorts", {})[folderKey(p)];
    if (own) return own;
    if (isDownloads(p)) return { key: "modified", dir: -1, group: true, foldersFirst: false };

    }));
    // recently used files, one click to open
    add("Recent files", recent.slice(0, 8).map(f => {
      const c = Object.assign(document.createElement("div"), { className: "card tilt" });
      const pic = picture(f);
      if (!pic.classList.contains("thumb")) pic.classList.add("ico");
      const t = document.createElement("div");
      t.append(Object.assign(document.createElement("b"), { textContent: f.name }), Object.assign(document.createElement("small"), { textContent: parentOf(f.path) }));
      c.append(pic, t);
      c.title = f.path;
      c.onclick = () => invoke("fs_action", { action: "open", path: f.path });
      c.oncontextmenu = e => { e.preventDefault(); popupMenu([
        { text: "Open", icon: "ph-arrow-square-out", action: () => c.onclick() },
        { text: "Open file location", icon: "ph-folder-open", action: () => go(parentOf(f.path)) },
        { text: "Copy path", icon: "ph-link", action: () => navigator.clipboard.writeText(f.path).then(() => say("Path copied")) },
      ]); };
      return c;
    }));
    main.appendChild(content);
    statusL.textContent = `${places.length} folders · ${drives.length} drives`;
    statusR.textContent = "";
    [renameBtn, copyBtn, deleteBtn, propsBtn, lookBtn, cutBtn, copyFilesBtn, pasteBtn].forEach(b => b.classList.add("off"));
  }

  // ---------- selection ----------
  function select(e, ev) {
    if (ev.shiftKey && anchor) {
      const a = shown.findIndex(x => x.path === anchor), b = shown.findIndex(x => x.path === e.path);
      if (!ev.ctrlKey) selected.clear();
      shown.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => selected.add(x.path));
    } else if (ev.ctrlKey) {
      selected.has(e.path) ? selected.delete(e.path) : selected.add(e.path);
      anchor = e.path;
    } else {
      selected.clear(); selected.add(e.path); anchor = e.path;
    }
    paintSelection();
    if (look.classList.contains("on")) openLook(e);
  }
  function paintSelection() {
    main.querySelectorAll(".item").forEach(el => el.classList.toggle("sel", selected.has(el._e.path)));
    updateStatus();
  }
  const selectedEntries = () => shown.filter(e => selected.has(e.path));
  function updateStatus() {
    if (!path) return;
    const sel = selectedEntries();
    const what = results ? `${shown.length} result${shown.length === 1 ? "" : "s"} for “${resultsQuery}” in this folder and its subfolders` : `${shown.length} item${shown.length === 1 ? "" : "s"}`;
    statusL.textContent = what + (sel.length ? ` · ${sel.length} selected` : "");
    const bytes = sel.filter(e => !e.dir).reduce((s, e) => s + e.size, 0);
    statusR.textContent = bytes ? size(bytes) : "";
    renameBtn.classList.toggle("off", sel.length !== 1);
    lookBtn.classList.toggle("off", sel.length !== 1 || sel[0].dir);
    [copyBtn, deleteBtn, propsBtn, cutBtn, copyFilesBtn].forEach(b => b.classList.toggle("off", !sel.length));
    pasteBtn.classList.toggle("off", !path || !!results);
  }

  // drag a box over empty space to select everything in it (Ctrl adds to the selection)
  main.addEventListener("mousedown", ev => {
    if (ev.button !== 0 || !path || ev.target.closest(".sortbar, .ghead, .lhead, input")) return;
    const box = main.getBoundingClientRect();
    const sx = ev.clientX - box.left + main.scrollLeft, sy = ev.clientY - box.top + main.scrollTop;
    const keep = ev.ctrlKey ? new Set(selected) : new Set();
    let band = null;
    const move = e => {
      const x = e.clientX - box.left + main.scrollLeft, y = e.clientY - box.top + main.scrollTop;
      if (!band && Math.hypot(x - sx, y - sy) < 5) return;
      if (!band) { band = Object.assign(document.createElement("div"), { className: "band" }); main.appendChild(band); }
      const l = Math.min(x, sx), t = Math.min(y, sy), w = Math.abs(x - sx), h = Math.abs(y - sy);
      Object.assign(band.style, { left: l + "px", top: t + "px", width: w + "px", height: h + "px" });
      const r = band.getBoundingClientRect();
      selected.clear(); keep.forEach(p => selected.add(p));
      main.querySelectorAll(".item").forEach(el => {
        const b = el.getBoundingClientRect();
        if (b.right > r.left && b.left < r.right && b.bottom > r.top && b.top < r.bottom) selected.add(el._e.path);
      });
      paintSelection();
      // scroll when dragging past the edge
      if (e.clientY > box.bottom - 20) main.scrollTop += 14; else if (e.clientY < box.top + 20) main.scrollTop -= 14;
    };
    const up = () => {
      removeEventListener("mousemove", move); removeEventListener("mouseup", up);
      if (band) { band.remove(); suppressClick = true; setTimeout(() => suppressClick = false, 0); }
    };
    addEventListener("mousemove", move); addEventListener("mouseup", up);
  });
  let suppressClick = false;
  main.onclick = () => { if (suppressClick) return; selected.clear(); paintSelection(); };

  // Ctrl+wheel: bigger or smaller tiles
  main.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (view !== "grid") { view = "grid"; store.set("files-view", view); }
    tile = Math.max(76, Math.min(220, tile - Math.sign(e.deltaY) * 16));
    store.set("files-tile", tile);
    main.style.setProperty("--tile", tile + "px");
  }, { passive: false });

  // ---------- quick look ----------
  let lookPath = null;
  async function openLook(e) {
    if (!e || e.dir) return closeLook();
    lookPath = e.path;
    const ext = extOf(e.name);
    lookName.textContent = e.name;
    lookInfo.textContent = `${typeOf(e)} · ${size(e.size)} · ${when(e.modified)}`;
    lookView.innerHTML = "";
    const src = convertFileSrc(e.path);
    if (IMAGE.has(ext)) lookView.appendChild(Object.assign(document.createElement("img"), { src }));
    else if (VIDEO.has(ext)) lookView.appendChild(Object.assign(document.createElement("video"), { src, controls: true, autoplay: true }));
    else if (AUDIO.has(ext)) lookView.appendChild(Object.assign(document.createElement("audio"), { src, controls: true, autoplay: true }));
    else if (ext === "pdf") lookView.appendChild(Object.assign(document.createElement("iframe"), { src }));
    else if (TEXT.has(ext) || e.size < 64 * 1024) {
      try {
        const text = await invoke("fs_read_text", { path: e.path });
        if (lookPath !== e.path) return;
        lookView.appendChild(Object.assign(document.createElement("pre"), { textContent: text }));
      } catch { info(e); }
    } else info(e);
    look.classList.add("on");
    function info(e) {
      const d = Object.assign(document.createElement("div"), { className: "info" });
      const img = picture(e); img.className = "";
      d.append(img, Object.assign(document.createElement("div"), { textContent: "No preview for this kind of file. Press Enter to open it." }));
      lookView.innerHTML = ""; lookView.appendChild(d);
    }
  }
  function closeLook() {
    if (!look.classList.contains("on")) return;
    look.classList.remove("on");
    lookPath = null;
    setTimeout(() => { if (!lookPath) lookView.innerHTML = ""; }, 250);
  }
  look.onclick = e => { if (e.target === look) closeLook(); };
  lookBtn.onclick = () => openLook(selectedEntries()[0]);

  // ---------- actions ----------
  function openEntry(e) {
    if (e.dir) go(e.path);
    else invoke("fs_action", { action: "open", path: e.path });
  }
  function copyPaths(list) {
    navigator.clipboard.writeText(list.map(e => e.path).join("\r\n")).then(() => say(list.length > 1 ? "Paths copied" : "Path copied"));
  }
  function startRename(e) {
    const el = [...main.querySelectorAll(".item")].find(x => x._e.path === e.path);
    if (!el) return;
    const label = el.querySelector(".name") || el.querySelector(".nm span:last-child");
    const inp = Object.assign(document.createElement("input"), { className: "rename", value: e.name, spellcheck: false });
    label.replaceWith(inp);
    el.draggable = false;
    inp.focus();
    const dot = e.dir ? -1 : e.name.lastIndexOf(".");
    inp.setSelectionRange(0, dot > 0 ? dot : e.name.length);
    let done = false;
    const finish = async commit => {
      if (done) return; done = true;
      if (commit && inp.value.trim() && inp.value !== e.name) {
        try { const np = await invoke("fs_rename", { path: e.path, name: inp.value }); selected.clear(); selected.add(np); }
        catch (err) { say(String(err)); }
      }
      refresh();
    };
    inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === "Enter") finish(true); if (ev.key === "Escape") finish(false); };
    inp.onclick = ev => ev.stopPropagation();
    inp.onmousedown = ev => ev.stopPropagation();
    inp.onblur = () => finish(true);
  }
  async function newFolder() {
    if (!path) return;
    try {
      const np = await invoke("fs_new_folder", { dir: path });
      entries = await invoke("fs_list", { path });
      selected.clear(); selected.add(np);
      render(false);
      const e = shown.find(x => x.path === np);
      if (e) startRename(e);
    } catch (err) { say(String(err)); }
  }
  // ---------- copy, cut and paste (shared with other apps) ----------
  const cutPaths = new Set();
  let landed = new Set();
  async function clip(list, cut) {
    if (!list.length) return;
    try {
      await invoke("fs_clip_set", { paths: list.map(e => e.path), cut });
      cutPaths.clear();
      if (cut) list.forEach(e => cutPaths.add(e.path));
      paintCut();
      say(`${list.length === 1 ? "“" + list[0].name + "”" : list.length + " items"} ${cut ? "cut" : "copied"}. Paste with Ctrl+V.`);
    } catch (err) { say(String(err)); }
  }
  function paintCut() { main.querySelectorAll(".item").forEach(el => el.classList.toggle("cutting", cutPaths.has(el._e.path))); }
  async function pasteInto(dest) {
    dest = dest || path;
    if (!dest) return;
    const [paths] = await invoke("fs_clip_get");
    if (!paths.length) return say("There's nothing to paste. Copy or cut some files first.");
    const before = new Set(entries.map(e => e.path));
    say(`Pasting ${paths.length === 1 ? "1 item" : paths.length + " items"}…`);
    try { await invoke("fs_paste", { dest }); }
    catch (err) { return say(String(err)); }
    cutPaths.clear();
    if (dest === path) {
      entries = await invoke("fs_list", { path });
      landed = new Set(entries.filter(e => !before.has(e.path)).map(e => e.path));
      selected.clear(); landed.forEach(p => selected.add(p));
      render(false);
      setTimeout(() => landed.clear(), 800);
    } else refresh();
    say("Pasted");
  }

  // ---------- search through all subfolders (Enter in the search box) ----------
  let results = null, resultsQuery = "", searchRun = 0;
  async function deepSearch() {
    const q = filter.value.trim();
    if (!path || !q) return;
    const run = ++searchRun;
    statusL.textContent = `Searching for “${q}” in this folder and its subfolders…`;
    main.style.opacity = .5;
    const found = await invoke("fs_search", { root: path, query: q });
    main.style.opacity = "";
    if (run !== searchRun) return;
    results = found; resultsQuery = q;
    selected.clear();
    render(true);
  }

  let pendingDelete = null;
  function askDelete(list) {
    if (!list.length) return;
    pendingDelete = list;
    dlgTitle.textContent = list.length === 1 ? `Move “${list[0].name}” to the Recycle Bin?` : `Move ${list.length} items to the Recycle Bin?`;
    dlgText.textContent = "You can get them back from the Recycle Bin if you change your mind.";
    shade.classList.add("on");
    dlgYes.focus();
  }
  dlgNo.onclick = () => { shade.classList.remove("on"); pendingDelete = null; main.focus(); };
  dlgYes.onclick = async () => {
    shade.classList.remove("on");
    const list = pendingDelete; pendingDelete = null;
    try { await invoke("fs_recycle", { paths: list.map(e => e.path) }); sfx("close"); say(list.length === 1 ? "Moved to the Recycle Bin" : `${list.length} items moved to the Recycle Bin`); }
    catch (err) { say(String(err)); }
    selected.clear(); refresh(); main.focus();
  };
  shade.onclick = e => { if (e.target === shade) dlgNo.onclick(); };

  function itemMenu(e) {
    const sel = selectedEntries();
    const one = sel.length === 1;
    popupMenu([
      { text: "Open", icon: "ph-arrow-square-out", action: () => openEntry(e) },
      e.dir && one ? { text: "Open in new tab", icon: "ph-browsers", action: () => newTab(e.path) } : undefined,
      !e.dir && one ? { text: "Quick look", icon: "ph-eye", action: () => openLook(e) } : undefined,
      !e.dir && one ? { text: "Open with…", icon: "ph-app-window", action: () => invoke("fs_action", { action: "openwith", path: e.path }) } : undefined,
      results && one ? { text: "Open containing folder", icon: "ph-folder-open", action: () => go(parentOf(e.path)) } : undefined,
      null,
      { text: "Cut", icon: "ph-scissors", action: () => clip(sel, true) },
      { text: "Copy", icon: "ph-copy", action: () => clip(sel, false) },
      e.dir && one ? { text: "Paste into this folder", icon: "ph-clipboard-text", action: () => pasteInto(e.path) } : undefined,
      null,
      one ? { text: "Rename", icon: "ph-textbox", action: () => startRename(e) } : undefined,
      { text: one ? "Copy path" : "Copy paths", icon: "ph-link", action: () => copyPaths(sel) },
      e.dir && one ? { text: isPinned(e.path) ? "Unpin from sidebar" : "Pin to sidebar", icon: "ph-push-pin", action: () => togglePin(e.path) } : undefined,
      one ? { text: "Show in Windows File Explorer", icon: "ph-folder-open", action: () => invoke("fs_action", { action: "explorer", path: e.path }) } : undefined,
      null,
      { text: one ? "Move to Recycle Bin" : `Move ${sel.length} items to Recycle Bin`, icon: "ph-trash", danger: true, action: () => askDelete(sel) },
      one ? { text: "Properties", icon: "ph-info", action: () => invoke("fs_action", { action: "properties", path: e.path }) } : undefined,
    ].filter(x => x !== undefined));
  }
  function placeMenu(p) {
    popupMenu([
      { text: "Open", icon: "ph-arrow-square-out", action: () => go(p) },
      { text: "Open in new tab", icon: "ph-browsers", action: () => newTab(p) },
      { text: isPinned(p) ? "Unpin from sidebar" : "Pin to sidebar", icon: "ph-push-pin", action: () => togglePin(p) },
      { text: "Copy path", icon: "ph-link", action: () => navigator.clipboard.writeText(p).then(() => say("Path copied")) },
      { text: "Open in Windows File Explorer", icon: "ph-folder-open", action: () => invoke("open_explorer", { path: p }) },
      { text: "Properties", icon: "ph-info", action: () => invoke("fs_action", { action: "properties", path: p }) },
    ]);
  }
  main.oncontextmenu = ev => {
    ev.preventDefault();
    if (!path) return;
    selected.clear(); paintSelection();
    popupMenu([
      { text: "Paste", icon: "ph-clipboard-text", action: () => pasteInto() },
      { text: "New folder", icon: "ph-folder-plus", action: newFolder },
      { text: "Refresh", icon: "ph-arrow-clockwise", action: refresh },
      null,
      ...[["name", "Name"], ["modified", "Date modified"], ["size", "Size"], ["type", "Type"]].map(([k, l]) =>
        ({ text: "Sort by " + l.toLowerCase() + (sort.key === k ? (sort.dir > 0 ? "  ↑" : "  ↓") : ""), icon: "ph-arrows-down-up", action: () => setSort(k) })),
      null,
      { text: view === "grid" ? "List view" : "Grid view", icon: view === "grid" ? "ph-list" : "ph-squares-four", action: toggleView },
      { text: showHidden ? "Hide hidden items" : "Show hidden items", icon: showHidden ? "ph-eye-slash" : "ph-eye", action: toggleHidden },
      { text: isPinned(path) ? "Unpin this folder" : "Pin this folder to the sidebar", icon: "ph-push-pin", action: () => togglePin(path) },
      null,
      { text: "Open in Windows File Explorer", icon: "ph-folder-open", action: () => invoke("open_explorer", { path }) },
      { text: "Properties", icon: "ph-info", action: () => invoke("fs_action", { action: "properties", path }) },
    ].filter(x => x !== undefined));
  };

  // a click on the sorted column flips it; a new column starts the natural way
  // (names A to Z; dates and sizes newest and biggest first)
  function setSort(key) {
    const dir = sort.key === key ? -sort.dir : (key === "modified" || key === "size" ? -1 : 1);
    sort = { ...sort, key, dir };
    saveSort();
    achieve("tidy");
    sfx("tick");
    render(false);
  }
  function toggleView() { view = view === "grid" ? "list" : "grid"; store.set("files-view", view); render(true); }
  function toggleHidden() { showHidden = !showHidden; store.set("files-hidden", showHidden); render(false); }

  // ---------- buttons and keys ----------
  backBtn.onclick = goBack; fwdBtn.onclick = goFwd; upBtn.onclick = goUp; refreshBtn.onclick = refresh;
  newBtn.onclick = newFolder;
  renameBtn.onclick = () => { const s = selectedEntries(); if (s.length === 1) startRename(s[0]); };
  copyBtn.onclick = () => copyPaths(selectedEntries());
  deleteBtn.onclick = () => askDelete(selectedEntries());
  propsBtn.onclick = () => { const s = selectedEntries(); if (s[0]) invoke("fs_action", { action: "properties", path: s[0].path }); };
  viewBtn.onclick = toggleView;
  hiddenBtn.onclick = toggleHidden;
  filter.addEventListener("input", () => { if (results) { results = null; searchRun++; } render(false); });
  filter.addEventListener("keydown", e => {
    if (e.key === "Enter") deepSearch();
    if (e.key === "Escape") { filter.value = ""; results = null; searchRun++; render(false); main.focus(); }
    e.stopPropagation();
  });
  cutBtn.onclick = () => clip(selectedEntries(), true);
  copyFilesBtn.onclick = () => clip(selectedEntries(), false);
  pasteBtn.onclick = () => pasteInto();
  // the normal Windows File Explorer, here (or on its Home page from Pink Cloud's Home)
  explorerBtn.onclick = () => invoke("open_explorer", { path: path || null });

  // type a few letters to jump to the first item that starts with them
  let typed = "", typedTimer;
  function typeJump(ch) {
    typed += ch.toLowerCase();
    clearTimeout(typedTimer); typedTimer = setTimeout(() => typed = "", 800);
    const hit = shown.find(e => e.name.toLowerCase().startsWith(typed));
    if (hit) { select(hit, {}); [...main.querySelectorAll(".item")].find(x => x._e === hit)?.scrollIntoView({ block: "nearest" }); }
  }

  addEventListener("keydown", e => {
    if (shade.classList.contains("on")) { if (e.key === "Escape") dlgNo.onclick(); if (e.key === "Enter") dlgYes.onclick(); return; }
    if (e.target.tagName === "INPUT") return;
    const sel = selectedEntries();
    const k = e.key.toLowerCase();
    if (look.classList.contains("on") && (e.key === "Escape" || e.key === " ")) { e.preventDefault(); return closeLook(); }
    if (e.ctrlKey && k === "t") { e.preventDefault(); newTab(); }
    else if (e.ctrlKey && k === "w") { e.preventDefault(); closeTab(cur); }
    else if (e.ctrlKey && e.key === "Tab") { e.preventDefault(); switchTab((cur + (e.shiftKey ? tabs.length - 1 : 1)) % tabs.length); }
    else if (e.altKey && e.key === "ArrowLeft") goBack();
    else if (e.altKey && e.key === "ArrowRight") goFwd();
    else if (e.key === "Backspace" || (e.altKey && e.key === "ArrowUp")) goUp();
    else if (e.key === "F5") refresh();
    else if (e.key === "F2" && sel.length === 1) startRename(sel[0]);
    else if (e.key === "Delete") askDelete(sel);
    else if (e.key === " " && sel.length === 1) { e.preventDefault(); openLook(sel[0]); }
    else if (e.key === "Enter" && sel.length) sel.forEach(openEntry);
    else if (e.ctrlKey && k === "a") { e.preventDefault(); shown.forEach(x => selected.add(x.path)); paintSelection(); }
    else if (e.ctrlKey && e.shiftKey && k === "n") { e.preventDefault(); newFolder(); }
    else if (e.ctrlKey && k === "l") { e.preventDefault(); editAddress(); }
    else if (e.ctrlKey && k === "f") { e.preventDefault(); filter.focus(); }
    else if (e.ctrlKey && e.shiftKey && k === "c" && sel.length) copyPaths(sel);
    else if (e.ctrlKey && k === "c" && sel.length) clip(sel, false);
    else if (e.ctrlKey && k === "x" && sel.length) clip(sel, true);
    else if (e.ctrlKey && k === "v") pasteInto();
    else if (e.key === "Escape") { selected.clear(); paintSelection(); }
    else if (["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(e.key) && shown.length) {
      e.preventDefault();
      const curI = anchor ? shown.findIndex(x => x.path === anchor) : -1;
      const cols = view === "grid" && !sort.group ? Math.max(1, Math.floor((main.clientWidth - 28) / (tile + 6))) : view === "grid" ? 1 : 1;
      const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: view === "grid" ? cols : 1, ArrowUp: view === "grid" ? -cols : -1 }[e.key];
      const next = shown[Math.min(shown.length - 1, Math.max(0, curI + step))];
      select(next, { shiftKey: e.shiftKey });
      [...main.querySelectorAll(".item")].find(x => x._e === next)?.scrollIntoView({ block: "nearest" });
    }
    else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey && path) typeJump(e.key);
  });
  // mouse back/forward buttons
  addEventListener("mouseup", e => { if (e.button === 3) goBack(); if (e.button === 4) goFwd(); });

  // ---------- window ----------
  minBtn.onclick = () => appWindow.minimize();
  maxBtn.onclick = () => appWindow.toggleMaximize();
  closeBtn.onclick = () => closeAppWindow(win, appWindow);
  async function syncMax() { maxBtn.innerHTML = `<i class="ph ${(await appWindow.isMaximized()) ? "ph-copy-simple" : "ph-square"}"></i>`; }
  appWindow.onResized(syncMax);
  appWindow.onFocusChanged(({ payload: focused }) => { if (focused && path) refresh(); });

  // a folder opened from elsewhere gets its own tab (unless this one is still on Home)
  listen("files-open", ({ payload }) => {
    openAppWindow(win);
    if (!payload) return;
    const same = tabs.findIndex((t, i) => folderKey(i === cur ? path : t.path) === folderKey(payload));
    if (same >= 0) { switchTab(same); if (same === cur) refresh(); }
    else if (path === null && !back.length) go(payload);
    else newTab(payload);
  });

  iconFor("C:\\Windows\\explorer.exe").then(u => { if (u) { appIcon.src = u; explorerIcon.src = u; } });

  (async () => {
    [places, drives] = await Promise.all([invoke("fs_places"), invoke("fs_drives")]);
    // your user folder goes by its own name, so it isn't confused with the Home page
    places = places.map(p => p.icon === "ph-house-line" ? { ...p, name: p.path.split("\\").pop() } : p);
    path = undefined;
    back = []; fwd = [];
    await go(tabs[cur].path, "init");
    back = [];
    main.focus();
  })();
</script>
</body>
</html>
