<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pink Cloud Idle Screen</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Shown when you step away: a dreamy pink sky with a big clock, your song, and the
     visualizer. Any key or mouse movement makes it melt away. */
  html, body { cursor: none; }
  body { opacity: 0; transition: opacity 1.2s var(--smooth); overflow: hidden;
    background: var(--sky); color: #fff; }
  body.on { opacity: 1; }
  body.leaving { opacity: 0; transition-duration: .45s; }

  /* drifting clouds */
  .cloud { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); filter: blur(4px); pointer-events: none; }
  :root[data-theme="dark"] .cloud { background: radial-gradient(closest-side, color-mix(in srgb, var(--g1) 22%, transparent), transparent); }
  /* Cosmos: the clouds become glowing nebula wisps, and shooting stars streak by */
  :root[data-palette="cosmos"] .cloud { background: radial-gradient(closest-side, color-mix(in srgb, var(--g1) 30%, transparent), color-mix(in srgb, var(--g2) 8%, transparent) 60%, transparent); filter: blur(18px); }
  /* ...and the real Milky Way (a photo: ESO/S. Brunier, CC BY 4.0) arcs across the sky,
     turning ever so slowly. Its black sky is blended away so the nebula glow shows through. */
  #galaxy { position: absolute; left: 50%; top: 50%; width: max(150vw, 267vh); aspect-ratio: 2600 / 1460; translate: -50% -50%;
    object-fit: cover; pointer-events: none; display: none; mix-blend-mode: screen; filter: brightness(1.15) contrast(1.1) saturate(1.15);
    animation: wheel 300s ease-in-out infinite alternate; }
  :root[data-palette="cosmos"] #galaxy { display: block; }
  @keyframes wheel { from { transform: rotate(-24deg) scale(1); } to { transform: rotate(-18deg) scale(1.06); } }
  .shoot { position: absolute; width: 180px; height: 2px; border-radius: 2px; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 70%, var(--g2)); box-shadow: 0 0 10px var(--g2);
    transform: rotate(-28deg); animation: shoot 1.4s var(--ease) forwards; }
  @keyframes shoot { from { opacity: 0; translate: 0 0; } 15% { opacity: 1; } to { opacity: 0; translate: -520px 280px; } }
  @keyframes driftA { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .c1 { width: 640px; height: 220px; top: 8%; animation: driftA 95s linear infinite; }
  .c2 { width: 820px; height: 280px; top: 52%; animation: driftA 130s linear infinite -60s; }
  .c3 { width: 520px; height: 180px; top: 30%; animation: driftA 80s linear infinite -30s; opacity: .7; }
  .c4 { width: 700px; height: 240px; top: 72%; animation: driftA 110s linear infinite -85s; opacity: .8; }
  /* twinkling sparkles */
  :root[data-palette="cosmos"] .spark { width: 2px; height: 2px; box-shadow: 0 0 5px #fff; }
  .spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .15; transform: scale(.4); } }

  /* Grove: sunbeams through the trees, low mist, motes of light drifting up, and a ring of
     jade glyphs turning slowly behind the clock */
  .ray, .runes, .mote { display: none; }
  :root[data-palette="grove"] .ray, :root[data-palette="grove"] .runes, :root[data-palette="grove"] .mote { display: block; }
  :root[data-palette="grove"] .spark { display: none; }
  :root[data-palette="grove"] .cloud { background: radial-gradient(closest-side, rgba(170, 235, 140, .2), transparent); filter: blur(24px); }
  :root[data-palette="grove"] .c1, :root[data-palette="grove"] .c3 { top: 78%; }
  :root[data-palette="grove"] .center { text-shadow: 0 0 30px rgba(63, 240, 192, .35), 0 4px 24px rgba(0, 0, 0, .5); }
  .ray { position: absolute; top: -20vh; width: 9vw; height: 150vh; pointer-events: none; transform-origin: top center; mix-blend-mode: screen;
    background: linear-gradient(180deg, rgba(243, 221, 114, .32), rgba(190, 240, 120, .12) 55%, transparent 85%); filter: blur(14px);
    animation: sway 14s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(24deg); opacity: .55; } to { transform: rotate(30deg); opacity: 1; } }
  .mote { position: absolute; width: 5px; height: 5px; border-radius: 50%; pointer-events: none;
    background: #f6f0a0; box-shadow: 0 0 10px 2px rgba(220, 240, 120, .7); animation: rise linear infinite; }
  @keyframes rise { from { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 50% { transform: translate(30px, -30vh); } 85% { opacity: .8; } to { transform: translate(-10px, -65vh); opacity: 0; } }
  .runes { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -400px 0 0 -380px; pointer-events: none; opacity: .5;
    filter: drop-shadow(0 0 6px #3ff0c0) drop-shadow(0 0 18px rgba(63, 240, 192, .5)); animation: spin 180s linear infinite; }
  .runes .in { animation: spin 120s linear infinite reverse; transform-origin: 380px 380px; }
  /* the ring's glyphs dim and light up again, each in its own time */
  .runes path.g { animation: flicker 9s ease-in-out infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 40% { opacity: 1; } 60% { opacity: .08; } 80% { opacity: .9; } }
  .glyphs { position: absolute; pointer-events: none; opacity: 0; animation: glyph-fade 9s ease-in-out forwards;
    filter: drop-shadow(0 0 6px #3ff0c0) drop-shadow(0 0 16px rgba(63, 240, 192, .5)); }
  @keyframes glyph-fade { 0% { opacity: 0; filter: blur(3px) drop-shadow(0 0 6px #3ff0c0); } 30%, 70% { opacity: .65; } 100% { opacity: 0; filter: blur(3px) drop-shadow(0 0 6px #3ff0c0); } }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-shadow: 0 4px 24px rgba(120, 60, 120, .35); }
  .time { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 190px; font-weight: 600; letter-spacing: -6px; line-height: 1; font-variant-numeric: tabular-nums;
    animation: breathe 6s ease-in-out infinite; }
  .time .colon { animation: blink 2s steps(1) infinite; display: inline-block; transform: translateY(-10px); }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes breathe { 50% { transform: scale(1.015); } }
  .date { font-size: 26px; font-weight: 500; opacity: .95; }

  .song { margin-top: 44px; display: flex; align-items: center; gap: 18px; padding: 14px 22px 14px 14px; border-radius: 26px;
    background: rgba(255, 255, 255, .22); border: 1px solid rgba(255, 255, 255, .45); backdrop-filter: blur(18px); text-shadow: none;
    box-shadow: 0 18px 50px rgba(120, 60, 140, .25); opacity: 0; transform: translateY(20px); transition: opacity .8s, transform .8s var(--spring); }
  .song.on { opacity: 1; transform: none; }
  .song img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; animation: spin 12s linear infinite; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
  .song.paused img { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .song b { display: block; font-size: 20px; font-weight: 600; max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song span { display: block; font-size: 15px; opacity: .85; margin-top: 2px; }
  .chip { margin-top: 22px; padding: 8px 16px; border-radius: 18px; background: rgba(255, 255, 255, .22); border: 1px solid rgba(255, 255, 255, .4); font-size: 14px; text-shadow: none; opacity: 0; transition: opacity .6s; }
  .chip.on { opacity: 1; }
  .hint { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .7; animation: float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  #vis { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; pointer-events: none; }
</style>
</head>
<body>
  <img id="galaxy" src="img/milky-way.jpg" alt="">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
  <canvas id="vis"></canvas>
  <div class="center">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
    <div class="song" id="song"><img id="art" alt=""><div><b id="title"></b><span id="artist"></span></div></div>
    <div class="chip" id="chip"></div>
  </div>
  <div class="hint">Move the mouse or press a key to come back</div>

<script src="shared.js"></script>
<script>
  // sparkles scattered over the sky (in Cosmos a few twinkling stars over the real ones)
  for (let i = 0; i < 40; i++) {
    const s = Object.assign(document.createElement("div"), { className: "spark" });
    Object.assign(s.style, { left: Math.random() * 100 + "vw", top: Math.random() * 70 + "vh", animationDelay: -Math.random() * 3 + "s", animationDuration: 2 + Math.random() * 3 + "s" });
    document.body.insertBefore(s, document.body.firstChild);
  }

  // Grove: sunbeams, rising motes and the glyph ring (only shown in that theme)
  [[48, 0], [60, -4], [67, -9], [80, -2]].forEach(([x, d], i) => {
    const r = Object.assign(document.createElement("div"), { className: "ray" });
    Object.assign(r.style, { left: x + "vw", width: (i % 2 ? 5 : 9) + "vw", animationDelay: d + "s" });
    document.body.insertBefore(r, document.body.firstChild);
  });
  for (let i = 0; i < 36; i++) {
    const m = Object.assign(document.createElement("div"), { className: "mote" });
    const size = 2 + Math.random() * 4;
    Object.assign(m.style, { left: Math.random() * 100 + "vw", top: 55 + Math.random() * 50 + "vh", width: size + "px", height: size + "px",
      animationDuration: 12 + Math.random() * 14 + "s", animationDelay: -Math.random() * 26 + "s" });
    document.body.insertBefore(m, document.body.firstChild);
  }
  (function runeRing() {
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const C = 380, band = (r, n, s, rot) => {
      let d = "";
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        d += `<path class="g" style="animation-delay:${(-rnd() * 9).toFixed(1)}s;animation-duration:${(6 + rnd() * 6).toFixed(1)}s" transform="rotate(${(a * 180) / Math.PI + rot} ${C} ${C})" d="${glyphPath(C, C - r, s, rnd)}"/>`;
      }
      return d;
    };
    const ring = `<svg class="runes" viewBox="0 0 760 760" fill="none" stroke="#3ff0c0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="380" cy="380" r="372" stroke-width="1.5" opacity=".6"/><circle cx="380" cy="380" r="330" stroke-width="3"/>
      ${band(352, 48, 5, 0)}
      <g class="in"><circle cx="380" cy="380" r="296" stroke-width="1.2" stroke-dasharray="2 10"/>${band(270, 30, 7, 3)}
      <circle cx="380" cy="380" r="244" stroke-width="1.5" opacity=".7"/></g>
    </svg>`;
    document.body.insertAdjacentHTML("afterbegin", ring);
  })();
  // ...and lines of bigger glyphs that fade in somewhere on the screen and fade away again
  setInterval(() => {
    if (currentPalette() !== "grove" || !document.body.classList.contains("on") || Math.random() < .35) return;
    const n = 3 + Math.floor(Math.random() * 5), s = 9 + Math.random() * 7, step = s * 3.4, vertical = Math.random() < .5;
    let paths = "";
    for (let i = 0; i < n; i++) {
      const o = 10 + i * step + s * 1.7;
      paths += `<path d="${vertical ? glyphPath(s * 2 + 6, o, s) : glyphPath(o, s * 2.5 + 6, s)}"/>`;
    }
    const len = n * step + 20, [W, H] = vertical ? [s * 4 + 12, len] : [len, s * 5 + 12];
    document.body.insertAdjacentHTML("afterbegin", `<svg class="glyphs" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" fill="none" stroke="#7df7d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`);
    const el = document.body.firstElementChild, life = 7 + Math.random() * 5;
    // away from the clock in the middle
    const side = Math.random() < .5;
    Object.assign(el.style, { left: (side ? 4 + Math.random() * 20 : 72 + Math.random() * 20) + "vw", top: 6 + Math.random() * 60 + "vh", animationDuration: life + "s" });
    setTimeout(() => el.remove(), life * 1000 + 100);
  }, 2600);

  // Cosmos: a shooting star every few seconds
  setInterval(() => {
    if (currentPalette() !== "cosmos" || !document.body.classList.contains("on") || Math.random() < .4) return;
    const s = Object.assign(document.createElement("div"), { className: "shoot" });
    Object.assign(s.style, { left: 30 + Math.random() * 70 + "vw", top: Math.random() * 40 + "vh" });
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }, 2500);

  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const d = new Date();
    time.innerHTML = `${pad(d.getHours())}<span class="colon">:</span>${pad(d.getMinutes())}`;
    date.textContent = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  }
  tick(); setInterval(tick, 1000);

  // ---------- song ----------
  function showSong(s) {
    song.classList.toggle("on", !!s);
    if (!s) return;
    song.classList.toggle("paused", !s.playing);
    title.textContent = s.title;
    artist.textContent = s.artist || "";
    if (s.art) { art.src = s.art; art.style.display = ""; } else if (!art.src) art.style.display = "none";
  }
  listen("now-playing", ({ payload }) => showSong(payload));

  // notifications that came in while you were away
  let missed = 0;
  listen("notes-new", ({ payload }) => {
    if (!document.body.classList.contains("on")) return;
    missed += payload.length;
    chip.textContent = `${missed} new notification${missed === 1 ? "" : "s"}`;
    chip.classList.add("on");
  });

  // ---------- visualizer: soft mirrored waves along the bottom ----------
  const ctx = vis.getContext("2d");
  let target = new Float32Array(48), level = new Float32Array(48);
  listen("audio", ({ payload }) => { for (let i = 0; i < 48; i++) target[i] = (payload[i] || 0) / 255; });
  function draw() {
    const dpr = devicePixelRatio, W = vis.width = vis.clientWidth * dpr, H = vis.height = vis.clientHeight * dpr;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < 48; i++) level[i] += (target[i] - level[i]) * .3;
    const n = 96, slot = W / n, bw = slot * .6;
    const g = ctx.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, "rgba(255,255,255,.75)"); g.addColorStop(.5, (themeColors.g2 || "#ffffff") + "66"); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    for (let k = 0; k < n; k++) {
      const band = k < 48 ? 47 - k : k - 48, h = Math.pow(level[band], 1.3) * H * .95;
      if (h > 1) { ctx.beginPath(); ctx.roundRect(k * slot + (slot - bw) / 2, H - h, bw, h + bw, bw / 2); ctx.fill(); }
    }
    if (document.body.classList.contains("on")) requestAnimationFrame(draw);
  }

  // ---------- coming and going ----------
  let shownAt = 0, start = null;
  listen("idle-show", () => {
    bump("daydream");
    missed = 0; chip.classList.remove("on");
    invoke("now_playing").then(showSong);
    document.body.classList.remove("leaving");
    requestAnimationFrame(() => document.body.classList.add("on"));
    shownAt = Date.now(); start = null;
    requestAnimationFrame(draw);
  });
  function leave() {
    if (!document.body.classList.contains("on") || Date.now() - shownAt < 800) return;
    document.body.classList.add("leaving");
    setTimeout(() => { document.body.classList.remove("on", "leaving"); invoke("hide_idle"); }, 450);
  }
  addEventListener("mousemove", e => {
    // a real movement, not the tiny jitter some mice make
    if (!start) { start = [e.screenX, e.screenY]; return; }
    if (Math.hypot(e.screenX - start[0], e.screenY - start[1]) > 12) leave();
  });
  addEventListener("mousedown", leave);
  addEventListener("keydown", leave);
  addEventListener("wheel", leave);
</script>
</body>
</html>
